<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Favoritos</title>

<style>

body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:20px;
}

input{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

.grupo{
  margin-top:30px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:15px;
}

.card a{
  color:#60a5fa;
}

</style>
</head>
</html>
