<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato</title>
    <link rel="stylesheet" href="./src/css/reset.css" />
    <link rel="stylesheet" href="./src/css/responsivocontato.css" />
    <link rel="stylesheet" href="./src/css/estilocontato.css" />
</head>
<body id="contato">
          
        <main>

              <header>
                <div class="logo" id="logo">
                <a href="https://www.eprajapa.com.br/" target="_blank">
                    <img src="./src/imagens/logo.png" alt="Logo E-PRAJAPA">
                </a>
            </div>
            <div class="pedidologo">
                <a href="https://eprajapa.ccmpedidoonline.com.br/" target="_blank">
                    <img class="pedido" src="./src/imagens/pedido.png" alt="Faça seu Pedido">
                </a>
            </div>
            <ul class="btn-ul">
                <li>
                    <a href="index.html" class="btn-home"><strong>Voltar</strong></a>
                </li>
            </ul>
        </header>
            <div class="bc-container">
                <img class="bc-img" src="./src/imagens/back-contato.jpg" alt="background_contato" />
            </div>
            <section>
                <div>
                    <a href="https://eprajapa.ccmpedidoonline.com.br/" target="_blank">
                        <img class="pedido" src="./src/imagens/pedido.png" alt="Faça seu Pedido" />
                    </a>
                </div>
                <form action="https://api.staticforms.xyz/submit" method="post">
                    <label>Nome</label>
                    <input type="text" name="name" placeholder="Digite seu nome" autocomplete="off" required />
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Digite seu email" autocomplete="off" required />
                    <label>Mensagem</label>
                    <textarea name="message" cols="30" rows="10" placeholder="Digite sua mensagem" required></textarea>
                    <button type="submit">Enviar</button>
                    <input type="hidden" name="accessKey" value="042be0d3-84fa-4ae8-aaed-2434cda72cac" />
                    <input type="hidden" name="redirectTo" value="http://127.0.0.1:5501/obrigado.html" />
                </form>
                <aside class="menu-lateral">
                    <ul>
                        <li>
                            <a href="https://www.facebook.com/EPRAJAPA1/" target="_blank">
                                <img src="./src/imagens/facebook.png" alt="ícone Facebook" class="icone" />
                            </a>
                        </li>
                        <li>
                            <a href="https://www.instagram.com/eprajapa/" target="_blank">
                                <img src="./src/imagens/instagram.png" alt="ícone Instagram" class="icone" />
                            </a>
                        </li>
                        <li>
                            <a href="https://api.whatsapp.com/send?phone=5521979984218&text=Quero%20um%20Japa" target="_blank">
                                <img src="./src/imagens/whatsapp.png" class="wattsapp" alt="ícone WhatsApp" />
                            </a>
                        </li>
                    </ul>
                </aside>
            </section>
        </main>
    </body>
</html>
